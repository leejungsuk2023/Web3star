<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swipe Unlock Preview</title>
  <style>
    body {
      margin: 0; min-height: 100vh; background: #05050c; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 32px 16px; font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: 13px; color: #a1a1aa; margin: 0; font-weight: 500; }
    .phone { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .logo-circle {
      width: 160px; height: 160px; border-radius: 9999px; padding: 3px;
      background: linear-gradient(135deg, #a855f7, #3b82f6, #22d3ee);
    }
    .logo-circle-inner { width: 100%; height: 100%; border-radius: 9999px; background: #000; }
    .wrap {
      width: 100%; border-radius: 9999px;
      box-shadow: 0 0 12px rgba(168,85,247,0.4), 0 0 26px rgba(34,211,238,0.32);
    }
    .track {
      position: relative; height: 58px; border-radius: 9999px; overflow: hidden;
      background:
        linear-gradient(90deg, #0c0a14, #0a0c16 45%, #071018) padding-box,
        linear-gradient(90deg, #c026ff, #6366f1, #22d3ee) border-box;
      border: 2px solid transparent;
    }
    .fill {
      position: absolute; inset: 2px; border-radius: 9999px; pointer-events: none;
      background: linear-gradient(90deg, rgba(192,38,255,0.16), rgba(99,102,241,0.05) 40%, rgba(34,211,238,0.14));
    }
    .label {
      position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center;
      padding: 0 56px; font-size: 16px; font-weight: 700; line-height: 1; text-align: center;
      color: rgba(255,255,255,0.95); text-shadow: 0 1px 8px rgba(0,0,0,0.85); pointer-events: none;
    }
    .thumb {
      position: absolute; left: 9px; top: 50%; width: 40px; height: 40px; margin-top: -20px; z-index: 2;
      border-radius: 9999px; display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle, rgba(250,245,255,0.45) 0%, rgba(168,85,247,0.5) 55%, rgba(88,28,135,0.35) 100%);
      box-shadow: inset 0 0 0 1px rgba(232,121,249,0.85), 0 0 8px rgba(232,121,249,0.55);
    }
    .thumb img {
      display: block; width: 78%; height: 78%; object-fit: contain; object-position: center;
    }
    .lock {
      position: absolute; right: 9px; top: 50%; width: 40px; height: 40px; margin-top: -20px; z-index: 2;
      border-radius: 9999px; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle, rgba(165,243,252,0.45) 0%, rgba(34,211,238,0.35) 50%, rgba(8,47,73,0.25) 100%);
      box-shadow: inset 0 0 0 1px rgba(34,211,238,0.9), 0 0 8px rgba(34,211,238,0.55);
    }
    .lock img {
      width: 30px; height: 30px; object-fit: contain;
      filter: brightness(1.3) contrast(1.15) drop-shadow(0 0 6px rgba(34,211,238,1));
    }
    .timer {
      font-family: ui-monospace, monospace; font-size: 34px; font-weight: 700; letter-spacing: 0.08em;
      background: linear-gradient(90deg, #c084fc, #60a5fa, #22d3ee);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { font-size: 11px; letter-spacing: 0.2em; color: #6b7280; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Swipe unlock — logo centered in circle</h1>
  <div class="phone">
    <div class="logo-circle"><div class="logo-circle-inner"></div></div>
    <div class="wrap">
      <div class="track">
        <div class="fill"></div>
        <div class="label">Swipe to Unlock Mining</div>
        <div class="thumb"><img src="./mining-swipe-diamond.png?t=22" alt="logo" /></div>
        <div class="lock"><img src="./mining-swipe-lock.png?t=22" alt="lock" /></div>
      </div>
    </div>
    <div class="timer">00:00:00</div>
    <div class="sub">Next Mining Cycle</div>
  </div>
</body>
</html>
